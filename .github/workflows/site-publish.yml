# Publishes botdot.app (ADR 172) on GitHub Pages: site/ built by SvelteKit, with the changelog from whats-new/.
# Nothing is published until the owner turns Pages on (Settings → Pages → Source "GitHub Actions"). Then a run by
# hand publishes, and the repository variable SITE_PAGES set to true publishes each change to main.
name: Site publish

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'whats-new/*.md'
      - 'lib/whats-new.js'
      - '.github/workflows/site-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and one that is going finishes: the newest change waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.SITE_PAGES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
