# botdot installed end to end in a nested Docker daemon (`make install-real`, tests/integration/install-real.js),
# on every change to what an install runs: the installer and the signature check it shares with the updater, the
# compose files, the Dockerfile, the docker-helper, the updater and the image workflow, and the stage itself.
# Pull requests only: a second run on main after the merge repeats the same check, and the nightly image build
# catches a merge that was not up to date with main.
#
# Where it runs: on GitHub's own throwaway machines for every event (#528). The stage runs a privileged container,
# and a fork's pull request may change this file, so no runner of the owner's may take it.
name: Install

on:
  pull_request:
    paths:
      - install.sh
      - compose*.yaml
      - Dockerfile
      - lib/docker-helper.js
      - front-door.js
      - lib/front-door/**
      - lib/updates.js
      - lib/signed-image.js
      - lib/registry.js
      - lib/release-manifest.js
      - lib/release-trust.js
      - .github/workflows/images.yml
      - .github/workflows/install.yml
      - tests/integration/install-real.*
      - tests/integration/test-install.js
      - tests/integration/install-prereqs.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cases in four shares, each on a machine of its own (INSTALL_REAL_SHARD, every 4th case): one runner took 16
  # minutes for them one after another.
  install-real-shard:
    name: install-real (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install-real
        env:
          INSTALL_REAL_SHARD: ${{ matrix.shard }}/4

  # The public install, end to end, on machines of other distributions (INSTALL_REAL_DISTRO): Debian's, Fedora's and
  # the RHEL family's tools under the installer, with Docker and gVisor already on them.
  install-real-distro:
    name: install-real (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, fedora-43, rocky-10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install-real
        env:
          INSTALL_REAL_DISTRO: ${{ matrix.distro }}
          INSTALL_REAL_CASE: a public install from the registry

  # What the installer itself installs on a fresh machine of each distribution: Docker, rootless Docker and gVisor.
  install-prereqs:
    name: install-prereqs (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13, fedora-43, rocky-10, alma-9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install-prereqs
        env:
          INSTALL_PREREQS_DISTRO: ${{ matrix.distro }}

  # One check named as before, green when every share and every distribution passed.
  install-real:
    needs: [install-real-shard, install-real-distro, install-prereqs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.install-real-shard.result }}" = success
      - run: test "${{ needs.install-real-distro.result }}" = success
      - run: test "${{ needs.install-prereqs.result }}" = success
