# The Android app's data layer for the iPhone (ADR 242, #1357): android/shared built for the phone and the simulator,
# and its common tests (the shared fixtures) run in the simulator, on GitHub's own Mac. Nothing is signed and no job
# holds a secret: neither needs an Apple account.
name: iOS shared

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ios-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-shared-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build for the iPhone and test in the simulator
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test --console=plain
