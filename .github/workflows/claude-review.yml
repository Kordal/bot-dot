# Claude reviews every pull request opened from a branch of this repository, when it opens, gets a push, is reopened
# or leaves draft. Claude leaves inline comments on the lines it finds wrong and one summary comment that starts with
# "Claude review" and ends with "No issues found." when there is nothing to fix. A new push cancels the review still
# running for the same pull request. Drafts and forks are skipped: a fork's pull request gets no secrets.
# @claude on a pull request is claude.yml.
#
# Either secret signs in: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, billed to the Claude plan) or
# ANTHROPIC_API_KEY (billed per token; it wins when both are set). The Claude GitHub app must be installed on the
# repository.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude's own pushes (from a mention) are reviewed too.
          allowed_bots: 'claude[bot],claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff (`gh pr diff`). Read AGENTS.md first and hold the change to its rules,
            and read the code around the change where you need it to judge.

            Report only what is worth fixing before merge: bugs, broken behavior, security problems, data loss,
            missing or wrong tests for changed behavior, docs that now say something untrue, and clear breaks of
            AGENTS.md. No style nits, no praise, no restating the change.

            Put each finding as an inline comment on its line (mcp__github_inline_comment__create_inline_comment):
            what is wrong, the concrete case that breaks, and the fix.

            Then post exactly one summary comment with `gh pr comment`. Its first line is "Claude review", then a
            short numbered list of the findings (file:line and one sentence each). When there is nothing to fix,
            the whole body is "Claude review" and, on the next line, "No issues found."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
