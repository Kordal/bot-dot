# Web/server and Android checks. Publishing workflows call this first, so a failed check blocks publication.
#
# Where they run: every job on GitHub's own throwaway machines, whoever opened the pull request (#528). The
# repository is public, so a fork's pull request may change this file: test/workflows.test.js fails when any
# workflow names another runner.
name: Tests

on:
  pull_request:
  workflow_call:
    # Which parts to test: both by default.
    inputs:
      server: { type: boolean, default: true }
      android: { type: boolean, default: true }
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push ends its run that is still going: only its latest commit is tested. Other runs (by
# hand, called from a workflow) each have a group of their own, so any number run side by side.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts this run tests. A pull request tests what it changed: the server when a file outside android/
  # changed (or any Markdown file, or Android's ui/Theme.kt, which tests/ compares), Android when a file in android/ or this workflow changed.
  # A call from another workflow says which by its inputs; missing inputs enable both (toJSON keeps a missing input
  # from comparing loosely as false). A run by hand tests both. A job left out is skipped, which a required check counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.which.outputs.server }}
      android: ${{ steps.which.outputs.android }}
    steps:
      # A pull request's checkout is its merge commit: the first parent is the base, so the diff is the change.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: which
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ toJSON(inputs.server) != 'false' }}
          ANDROID: ${{ toJSON(inputs.android) != 'false' }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            FILES="$(git diff --name-only HEAD^1 HEAD)"
            printf '%s\n' "$FILES"
            SERVER=false ANDROID=false
            if printf '%s\n' "$FILES" | grep -qvE '^android/' || printf '%s\n' "$FILES" | grep -qE '(\.md|/ui/Theme\.kt)$'; then SERVER=true; fi
            if printf '%s\n' "$FILES" | grep -qE '^(android/|\.github/workflows/tests\.yml$)'; then ANDROID=true; fi
          fi
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "Testing: server $SERVER, Android $ANDROID"

  # The server tests, split over two machines by file (node --test --test-shard): on one they took 6 to 7.5 minutes,
  # the longest step of every pull request and of each image build.
  server-tests:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test -- --test-shard=${{ matrix.shard }}/2

  # The checks of make lint, beside the tests.
  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Every relative link in the Markdown files leads somewhere, and the checker's own tests.
      - run: bash tests/integration/check-docs.sh
      - run: node --test scripts/check-docs.test.mjs
      # Every JavaScript file parses, and the files marked // @ts-check type-check (make lint, #77).
      - run: node scripts/check-code.js
      # Font sizes, weights, radii and spacings keep to the scales (make lint, #721).
      - run: node scripts/check-css-tokens.js
      - run: bash scripts/typecheck.sh

  # The one check named "server": passed when both shards and the lint passed, skipped when the server isn't tested.
  server:
    needs: [changes, server-tests, server-lint]
    if: always() && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          TESTS: ${{ needs.server-tests.result }}
          LINT: ${{ needs.server-lint.result }}
        run: |
          echo "Tests: $TESTS, lint: $LINT"
          [ "$TESTS" = success ] && [ "$LINT" = success ]

  # The bots' and the Chief's own Linux users (identity.js): real processes under their users try
  # the owner's controls. Needs root, so in a container.
  users:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl python3
      - run: BOT_DOT_TEST_UIDS=1 node --test test/users.test.js test/nonroot.test.js test/principal-fs.test.js test/privilege-broker.test.js test/update-install.test.js

  # No passwords, tokens or keys in the code or its history: on every run, whatever changed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history
      - name: Scan with gitleaks (rules in .gitleaks.toml)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose .

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # No assembleDebug: the unit tests and lint compile the app, and android.yml's release build packages it. The
      # shared data layer's tests (android/shared, ADR 242) run on the JVM here, and in the iOS simulator in ios-shared.yml.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :shared:testAndroidHostTest --console=plain

  # Lint on a machine of its own, beside the unit tests: one after the other they took twice as long.
  android-lint:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # New lint problems fail the build; the ones already there are listed in app/lint-baseline.xml.
      - name: Lint
        run: ./gradlew lintDebug --console=plain

  # What needs Android itself, on an emulator (app/src/androidTest): the browser's way back to the app after the
  # sign-in (botdot://signed-in), found by the app's manifest, and its code turned into the session at a stand-in
  # front door. GitHub's Linux machines have KVM; the rule below lets the emulator use it.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built before the emulator starts, so its time goes to the tests.
      - name: Build the app and its instrumented tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
