# The iOS app (ADR 151, #962): the desktop app's Tauri project built for the iPhone simulator, on GitHub's own Mac.
# Its Xcode project is made here by `tauri ios init` each time (src-tauri/gen/ is not kept in git), so no change to the
# app needs a Mac. Nothing is signed and no job holds a secret: a simulator build needs no Apple account.
name: iOS

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.4'
  CARGO_TERM_COLOR: always

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-ios-sim
          rustc --version
          xcodebuild -version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ios-sim-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ios-sim-

      # What only the desktop has is left out on iOS: nothing unused may stay behind.
      - name: Lint
        run: cargo clippy --locked --lib --target aarch64-apple-ios-sim -- -D warnings

      # Xcode's "Build Rust Code" phase calls the CLI the way `ios init` was called. Through npx that is
      # `npm run -- tauri`, so the CLI is installed here under an npm script of that name (nothing of it is kept).
      - name: Tauri CLI
        run: |
          echo '{"private":true,"scripts":{"tauri":"tauri"}}' > package.json
          npm install --no-save --no-package-lock --no-audit --no-fund "$TAURI_CLI"

      - name: Xcode project
        run: npm run -- tauri ios init --ci

      - name: Build
        run: npm run -- tauri ios build --ci --debug --target aarch64-sim

      # The app starts in a simulator, stays up, and shows its screen.
      - name: Start in the simulator
        run: |
          APP="$(find gen/apple/build -name '*.app' -type d -path '*sim*' | head -1)"
          [ -n "$APP" ] || APP="$(find gen/apple/build -name '*.app' -type d | head -1)"
          echo "App: $APP"
          [ -n "$APP" ] || { echo "No .app was built"; find gen/apple/build -maxdepth 4; exit 1; }
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" dev.botdot.ios
          sleep 15
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q 'dev.botdot.ios' || { echo "The app is not running"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/out/ios-simulator.png"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: ignore
