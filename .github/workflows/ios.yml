# The iOS app (ADR 242, #1358): the Android app's shared data layer (android/shared) tested in the simulator and built
# as BotdotShared.xcframework, the app made from ios/project.yml, built and tested in the simulator (make ios), and a
# screenshot of it there as an artifact. On GitHub's own Mac. Nothing is signed with a team and no job holds a secret: neither the
# simulator nor these builds need an Apple account.
# The job release-build archives the Release configuration with the Release framework, unsigned (scripts/ios-archive.sh,
# #1409), on main and on a pull request that changes what that archive is made of; ios-release.yml calls this workflow
# for its tests and archives signed itself.
name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'android/shared/**'
      - 'android/gradle/**'
      - 'android/*.kts'
      - 'scripts/ios-simulator.sh'
      - 'scripts/ios-archive.sh'
      - 'Makefile'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
  # A run on main writes the Gradle and Kotlin/Native caches every pull request then reads (a pull request's own run
  # only reads them).
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android/shared/**'
      - 'android/gradle/**'
      - 'android/*.kts'
      - 'scripts/ios-simulator.sh'
      - 'scripts/ios-archive.sh'
      - 'Makefile'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      # 'no': the caller archives itself (ios-release.yml).
      archive: { type: string, default: 'yes' }

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The simulator boots while Gradle builds (a cold boot is about two minutes on GitHub's Mac); make ios and the
      # screenshot use the same one.
      - name: Boot the simulator
        run: |
          sim="$(bash scripts/ios-simulator.sh)"
          [ -n "$sim" ] || { echo "No iPhone simulator on iOS 26 or later" >&2; exit 1; }
          echo "IOS_SIMULATOR=$sim" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$sim" >"$RUNNER_TEMP/simctl-boot.log" 2>&1 &
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # Kotlin/Native's compiler, LLVM and sysroot (about a minute to download and unpack), which setup-gradle leaves out,
      # one cache per Kotlin version: no older toolchain is carried into a newer key.
      - name: Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: XcodeGen
        run: brew install xcodegen && xcodegen --version && xcodebuild -version
      # The shared fixtures' tests in the simulator (the iOS side of every rule, against the files the web page and
      # Android are tested with), the device slice compiled, and both slices linked into the framework make ios uses,
      # in one Gradle run.
      - name: Shared data layer in the simulator
        working-directory: android
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test :shared:assembleBotdotSharedDebugXCFramework --console=plain
      - name: Save Kotlin/Native
        if: github.event_name == 'push' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Build and test the app
        run: make ios
      - name: Screenshot in the simulator
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcrun simctl install "$IOS_SIMULATOR" ios/build/Build/Products/Debug-iphonesimulator/BotDot.app
          xcrun simctl launch "$IOS_SIMULATOR" app.botdot
          sleep 5
          xcrun simctl io "$IOS_SIMULATOR" screenshot ios-skeleton.png
      - name: Simulator boot log
        if: failure()
        run: cat "$RUNNER_TEMP/simctl-boot.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshot-${{ github.sha }}
          path: ios-skeleton.png
          if-no-files-found: error

  # Whether this run archives the Release build: always by hand, never for ios-release.yml, and on a pull request or a
  # merge to main only when it changes what the archive is made of (it takes a Mac about a quarter of an hour).
  changes:
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.which.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the commit and its first parent: the pull request's base, or main before the merge
      - id: which
        env:
          EVENT: ${{ github.event_name }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          if [ "$ARCHIVE" = no ]; then A=false
          elif [ "$EVENT" = workflow_dispatch ]; then A=true
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/ios-archive\.sh|ios/project\.yml|\.github/workflows/ios(-release)?\.yml|android/shared/build\.gradle\.kts|android/gradle/libs\.versions\.toml)$'; then A=true
          else A=false
          fi
          echo "Release archive: $A"
          echo "archive=$A" >> "$GITHUB_OUTPUT"

  # The Release configuration with the Release framework, as TestFlight gets it, unsigned (#1409): Kotlin/Native's
  # Release-only problems (the optimiser, dead-code removal) show here, not first in a release.
  release-build:
    needs: changes
    if: needs.changes.outputs.archive == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore Kotlin/Native
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: XcodeGen
        run: brew install xcodegen && xcodegen --version && xcodebuild -version
      - name: Release archive, unsigned
        run: IOS_VERSION=1.0 IOS_BUILD=1 scripts/ios-archive.sh --unsigned
