# The desktop app (ADR 137, #883): its checks and its six builds, on GitHub's own machines and without Docker.
# Windows x64 and arm64 (NSIS installers) build on windows-latest, Apple silicon and Intel (a .dmg, and the .app the
# updater installs) on macos-latest, Linux x64 and arm64 (an AppImage, a .deb and an .rpm, ADR 170) on Ubuntu 22.04,
# whose older glibc the builds then run on and after. The Rust checks (clippy, unit tests) run on the three builds
# that run where they are built.
#
# When: on a pull request that changes the app or its workflows, and called by desktop-release.yml with the version
# it releases. Nothing here is signed and no job holds a secret: the release workflow signs what these builds hand
# it, so a pull request's code never reaches the update key.
name: Desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_call:
    inputs:
      # The version the builds carry; a pull request builds tauri.conf.json's own.
      version: { type: string, default: '' }

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.4'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            check: true
          - name: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            check: false
          - name: mac-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            check: true
          - name: mac-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            check: false
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            check: true
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            check: false
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # WebKitGTK and the tray's library, which the app links and its packages name; rpm builds the .rpm. The AppImage's
      # tools run without FUSE, which GitHub's machines lack.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Rust
        run: |
          rustup toolchain install # the release in rust-toolchain.toml
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ matrix.target }}-

      - name: Lint
        if: matrix.check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        if: matrix.check
        run: cargo test --locked

      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || VERSION="$(node -p "require('./tauri.conf.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "{\"version\":\"$VERSION\"}" > "$RUNNER_TEMP/version.json"
          echo "Building botdot $VERSION for ${{ matrix.name }}"

      # The cache keeps target/, and with it the bundles of an earlier version: only this build's are collected. The
      # bundler downloads its tools (NSIS, linuxdeploy) from GitHub's releases, which at times answer 5xx: a build that
      # failed on such a download tries again, up to three times, and any other failure ends it at once.
      - name: Build
        run: |
          for TRY in 1 2 3; do
            rm -rf target/${{ matrix.target }}/release/bundle
            # pipefail, as GitHub's bash runs: the build's own status, not tee's.
            if npx --yes "$TAURI_CLI" build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/version.json" 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
            grep -qE 'http status: 5[0-9][0-9]|returned error: 5[0-9][0-9]' "$RUNNER_TEMP/build.log" || exit 1
            echo "A download failed (try $TRY of 3); trying again in 30 s"
            sleep 30
          done
          exit 1

      # Named for the people who download them. The Mac's .app goes as a .tar.gz made here, which keeps its
      # permissions: the updater installs it, and the release workflow signs it.
      - name: Collect
        run: |
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.name }}" in
            windows-*)
              cp "$BUNDLE"/nsis/botdot_"$VERSION"_*-setup.exe "$OUT/botdot-$VERSION-${{ matrix.name }}-setup.exe"
              ;;
            mac-*)
              cp "$BUNDLE"/dmg/botdot_"$VERSION"_*.dmg "$OUT/botdot-$VERSION-${{ matrix.name }}.dmg"
              tar -czf "$OUT/botdot-$VERSION-${{ matrix.name }}.app.tar.gz" -C "$BUNDLE/macos" botdot.app
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/botdot_"$VERSION"_*.AppImage "$OUT/botdot-$VERSION-${{ matrix.name }}.AppImage"
              cp "$BUNDLE"/deb/botdot_"$VERSION"_*.deb "$OUT/botdot-$VERSION-${{ matrix.name }}.deb"
              cp "$BUNDLE"/rpm/botdot-"$VERSION"-*.rpm "$OUT/botdot-$VERSION-${{ matrix.name }}.rpm"
              ;;
          esac
          ls -l "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
