# botdot.app (ADR 173): a pull request that touches the site builds it and runs site/tests/. Publishing is
# site-publish.yml, which a pull request never starts.
name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'whats-new/*.md'
      - 'lib/whats-new.js'
      - 'README.md'
      - 'docs/desktop.md'
      - '.github/workflows/site.yml'
      - '.github/workflows/site-publish.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
