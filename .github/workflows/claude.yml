# @claude in a comment or review on a pull request, by someone with write access, runs Claude there. It can push
# commits to the pull request's branch; that push gets a review of its own (claude-review.yml). Mentions on one pull
# request run one after another, none dropped. A fork's pull request is skipped: Claude would run its code with the
# repository's secrets and write access.
#
# Either secret signs in: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, billed to the Claude plan) or
# ANTHROPIC_API_KEY (billed per token; it wins when both are set). The Claude GitHub app must be installed on the
# repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: claude-mention-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: echo "fork=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.fork == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - if: steps.pr.outputs.fork == 'false'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
