# The front door of a machine botdot runs on (ADR 028): the one program people reach. It signs them in with a
# passkey and passes each signed-in person to their own account's botdot server, over the socket in that account's
# folder under BOT_DOT_SOCKETS. It runs in the machine's own Docker; every account's botdot server runs in that
# account's rootless Docker (compose.yaml).
#
# People reach it in one of three ways, chosen at install (install.sh writes .env and, for a domain, the Caddyfile):
#   a public domain: Caddy (the `public` profile) answers on ports 80, 443 and 8443 (bots' interactive pages, #399) and
#                    fetches its own certificates
#   a tailnet only:  Tailscale Serve gives the front door its HTTPS name, and nothing is on the internet
# or, for the desktop app, on this computer only (local, ADR 136): http://localhost:<port>, one account
#                    (FRONT_DOOR_ONE_ACCOUNT) whose passkey is made with FRONT_DOOR_SETUP_KEY, and no admin page
# Beside it runs the machine's one shared embedding server (the `embed` profile, ADR 275), for the meaning search of every
# account on it: each account's botdot server reaches it over a Unix socket in a folder of its own (install.sh).
# A managed machine (FRONT_DOOR_MANAGED, ADR 154), on a public domain or a tailnet, has no admin page either: one
# account, or several whose first (FRONT_DOOR_FIRST_ACCOUNT) is made with the setup key.
services:
  front-door:
    image: ${BOT_DOT_IMAGE:-ghcr.io/ladrok/bot-dot:latest}
    command: ["node", "front-door.js"]
    restart: unless-stopped
    # The front door's own user of the machine (botdot-door), whose group is let through each account's socket
    # folder and nothing else of the account's.
    user: ${FRONT_DOOR_USER:?install.sh sets FRONT_DOOR_USER}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # On the machine's 127.0.0.1 only, where Caddy or Tailscale Serve reach it.
    network_mode: host
    # The image's own check asks botdot's port; install.sh checks the front door itself.
    healthcheck:
      disable: true
    environment:
      TZ: ${TZ:-UTC}
      FRONT_DOOR_ORIGIN: ${FRONT_DOOR_ORIGIN:?install.sh sets FRONT_DOOR_ORIGIN}
      FRONT_DOOR_ADMIN: ${FRONT_DOOR_ADMIN:-}
      FRONT_DOOR_ANDROID_KEYS: ${FRONT_DOOR_ANDROID_KEYS:-}
      # The terms and the privacy policy an owner agrees to at sign-up (#987): none unless the installer was given them.
      FRONT_DOOR_TERMS_URL: ${FRONT_DOOR_TERMS_URL:-}
      FRONT_DOOR_PRIVACY_URL: ${FRONT_DOOR_PRIVACY_URL:-}
      FRONT_DOOR_TERMS_VERSION: ${FRONT_DOOR_TERMS_VERSION:-}
      # On this computer only (local): its one account, and the setup key that makes its passkey.
      FRONT_DOOR_ONE_ACCOUNT: ${FRONT_DOOR_ONE_ACCOUNT:-}
      FRONT_DOOR_SETUP_KEY: ${FRONT_DOOR_SETUP_KEY:-}
      FRONT_DOOR_DEMO_CODE_SHA256: ${FRONT_DOOR_DEMO_CODE_SHA256:-}
      FRONT_DOOR_MANAGED: ${FRONT_DOOR_MANAGED:-}
      FRONT_DOOR_FIRST_ACCOUNT: ${FRONT_DOOR_FIRST_ACCOUNT:-}
      # A managed machine's billing page, Settings' "Subscription" (ADR 234): none unless the fleet console gave one.
      FRONT_DOOR_SUBSCRIPTION_URL: ${FRONT_DOOR_SUBSCRIPTION_URL:-}
      # 1 or 0, the first install's answer (#1567, ADR 259): the front door takes it only while its data has none.
      FRONT_DOOR_FEEDBACK_TO_DEVELOPERS: ${FRONT_DOOR_FEEDBACK_TO_DEVELOPERS:-}
      FRONT_DOOR_HOST: 127.0.0.1
      FRONT_DOOR_PORT: ${FRONT_DOOR_PORT:-4700}
      # Bots' interactive pages (#399, ADR 072): the sandbox's own address, on the front door's second port.
      FRONT_DOOR_SITES_ORIGIN: ${FRONT_DOOR_SITES_ORIGIN:-}
      FRONT_DOOR_SITES_PORT: ${FRONT_DOOR_SITES_PORT:-4701}
      FRONT_DOOR_SOCKETS: /sockets
      FRONT_DOOR_DATA: /data
      FRONT_DOOR_REQUESTS: /requests
      FRONT_DOOR_STATUS: /status
      FRONT_DOOR_LOAD: /load
    volumes:
      - ./data:/data                                 # accounts, passkeys, sessions, sign-up links
      - ./requests:/requests                         # new accounts and updates it asks for; root's step does them (install.sh)
      - ./status:/status:ro                          # the version installed and the last update, which root's step writes
      - ./load:/load:ro                              # the machine's load and each account's use, root's step writes it
      - ${BOT_DOT_SOCKETS:?install.sh sets BOT_DOT_SOCKETS}:/sockets:ro

  caddy:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    profiles: [public]
    restart: unless-stopped
    # Ports 80, 443 and 8443 of the machine: HTTPS for the domain and for bots' interactive pages on its port 8443, and
    # the challenge that fetches its certificate.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                             # its certificates and keys
      - caddy-config:/config

  # The machine's one embedding server, shared by every account (ADR 275): llama.cpp's llama-server with bge-m3, and
  # a proxy that gives each account a Unix socket of its own, <BOT_DOT_EMBED_SOCKETS>/<account>/embed.sock, in a folder
  # install.sh opens to this service's user and to that account's botdot server alone. It starts with the `embed`
  # profile, which install.sh sets on every machine but the desktop app's, where one account runs its own server.
  embed:
    image: ${BOT_DOT_IMAGE:-ghcr.io/ladrok/bot-dot:latest}
    command: ["node", "lib/embed-share.js"]
    profiles: [embed]
    restart: unless-stopped
    # Its own user of the machine (botdot-embed), which is let into each account's embedding folder and nothing else.
    user: ${BOT_DOT_EMBED_USER:-65534:65534}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # No network at all: llama-server listens on this container's own loopback, and the sockets are the only way in.
    network_mode: none
    environment:
      EMBED_SHARE_SOCKETS: /sockets
      EMBED_SHARE_SLOTS: ${BOT_DOT_EMBED_SLOTS:-4}
      EMBED_SHARE_THREADS: ${BOT_DOT_EMBED_THREADS:-}
    # The image's own check asks botdot's port; this asks llama-server, which takes a few seconds to load the model.
    healthcheck:
      test: ["CMD", "node", "lib/embed-share.js", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    volumes:
      - ${BOT_DOT_EMBED_SOCKETS:-./embed}:/sockets

volumes:
  caddy-data:
  caddy-config:
