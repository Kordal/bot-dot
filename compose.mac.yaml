# botdot on a Mac, set up by botdot for Mac ("Run botdot on this Mac"). The app keeps this file as
# compose.yaml in ~/Library/Application Support/botdot, next to a .env with the settings below, and
# botdot's updater in Settings refreshes it from the image (BOT_DOT_PLATFORM tells it which file).
#
# The same images as on Linux, but without host networking, which Docker Desktop on a Mac doesn't
# provide the same way. People reach botdot only through its front door (ADR 028), published on this
# Mac's 127.0.0.1 only as http://localhost: a machine of one account, whose passkey the app makes
# with its setup key; no sign-up links and no admin page. botdot itself publishes no port: the front
# door reaches it on its socket. Bots' computers are started through the Docker socket and publish no ports.
services:
  bot-dot:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    restart: unless-stopped
    # Only the local process/file supervisor remains root. server.js runs as 60000:60000.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: [no-new-privileges:true]
    environment:
      BOT_DOT_PLATFORM: mac
      TZ: ${TZ:-UTC}                              # schedules use this time zone (the app sets the Mac's)
      HOST: 0.0.0.0                               # inside the container, which publishes no port
      PORT: ${PORT:-4747}
      # Optional instead of /login: a token from `claude setup-token`
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The bots' computer (the app sets it). On a registry it is downloaded the first time a bot needs
      # one; without a registry, or when unset, it is a local image, built the first time if missing.
      BOT_DOT_COMPUTER_IMAGE: ${BOT_DOT_COMPUTER_IMAGE:-}
      BOT_DOT_HELPER_SOCKET: /run/botdot/helper.sock
      # The one account, and the socket its front door reaches it on (the supervisor gives the folder to botdot's user)
      BOT_DOT_ACCOUNT: owner
      BOT_DOT_FRONT_DOOR_SOCKET: /run/front-door/owner/botdot.sock
    volumes:
      - ./data:/data                                # bots, runs, memory, skills, vault (encrypted)
      - bot-dot-config:/config                      # the vault's encryption key, kept apart from the data
      - bot-dot-home:/root                          # application sign-ins migrated; legacy Docker credentials stay root-only
      - bot-dot-helper:/run/botdot:ro                # connect only; helper owns directory and socket
      - bot-dot-front-door:/run/front-door           # botdot's socket, for the front door
    depends_on:
      - docker-helper

  docker-helper:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    command: ["node", "lib/docker-helper.js"]
    restart: unless-stopped
    # Root with the Docker socket is as powerful as root on this machine; only the operations that
    # lib/docker-helper.js allows limit it. It runs without capabilities or new privileges, so a flaw in it
    # gives as little else as possible (SECURITY.md).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # In the server's group (SERVER_GID in lib/docker-helper.js), so it can hand the server its socket
    # without the capability CHOWN.
    group_add: ["60000"]
    healthcheck:
      disable: true
    environment:
      TZ: ${TZ:-UTC}
      BOT_DOT_PLATFORM: mac
      BOT_DOT_COMPUTER_IMAGE: ${BOT_DOT_COMPUTER_IMAGE:-}
      BOT_DOT_REGISTRY_TOKEN: ${BOT_DOT_REGISTRY_TOKEN:-}
    volumes:
      - bot-dot-helper:/run/botdot
      - /var/run/docker.sock:/var/run/docker.sock

  # The front door (ADR 028): the one thing the app and a browser on this Mac reach. It signs them in with the
  # passkey and passes their requests to botdot's socket. As botdot's own user, the only one its socket lets in.
  front-door:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    command: ["node", "front-door.js"]
    restart: unless-stopped
    user: "60000:60000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:${PORT:-4747}:4700"
    environment:
      TZ: ${TZ:-UTC}
      # A passkey belongs to one name: localhost (an address like 127.0.0.1 can hold none)
      FRONT_DOOR_ORIGIN: http://localhost:${PORT:-4747}
      FRONT_DOOR_HOST: 0.0.0.0
      FRONT_DOOR_PORT: 4700
      FRONT_DOOR_SOCKETS: /run/front-door
      FRONT_DOOR_DATA: /front-door
      FRONT_DOOR_ONE_ACCOUNT: owner
      # Makes the account's one passkey, until it has one (the app keeps it in a file only you can read)
      FRONT_DOOR_SETUP_KEY: ${FRONT_DOOR_SETUP_KEY:-}
    volumes:
      - ./front-door:/front-door                    # the account, its passkey and sessions
      - bot-dot-front-door:/run/front-door
    depends_on:
      - bot-dot

volumes:
  bot-dot-config:
  bot-dot-home:
  bot-dot-helper:
  bot-dot-front-door:
