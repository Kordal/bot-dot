<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{title}</title>
<link rel="stylesheet" href="viewer/viewer.css">
<link rel="stylesheet" href="viewer/drop.css">
<link rel="stylesheet" href="viewer/controls.css">
</head>
<body data-words="{words}">
<div id="screen"><div id="zoom"></div></div>
<div id="drop" hidden data-drop="{drop}"><p id="drop-hint"></p></div>
<div id="drop-note" role="status" aria-live="polite" hidden></div>
<div id="status" role="status" aria-live="polite" data-state="starting"></div>
<button id="clip-chip" type="button" hidden></button>
<div id="type-box" hidden>
  <form id="type-form" hidden>
    <textarea id="type-field" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button id="type-go" type="submit"></button>
  </form>
  <button id="type-open" type="button" aria-expanded="false"></button>
</div>
<script type="module" src="viewer/viewer.js"></script>
</body>
</html>
