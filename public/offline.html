<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title data-t>No connection · botdot</title>
  <!-- What the service worker (sw.js) shows when a page of botdot can't be loaded (issue #163): kept by it, so no
       file of its own beyond this one and i18n.js, which the worker keeps with it: that draws the marked words in the
       account's language, from the dictionary the page keeps in this browser (#647). -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #ecebe8; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(360px, calc(100vw - 32px)); text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; } h1 span { color: #d85a30; }
    p { color: #a3a29e; margin: 0 0 16px; }
    a { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #d85a30; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>bot<span>·</span>dot</h1>
    <p data-t>No connection to botdot. Check this device's internet, then try again.</p>
    <a href="" data-t>Try again</a>
  </main>
  <script src="/i18n.js"></script>
</body>
</html>
