# botdot for Mac. Generate the Xcode project with `xcodegen` (see README.md).
name: BotDot
options:
  bundleIdPrefix: dev.botdot
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BotDotKit:
    path: BotDotKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    # Builds from GitHub get their build number (mac.yml); your own builds stay 0 and never update themselves.
    CURRENT_PROJECT_VERSION: "0"
targets:
  BotDot:
    type: application
    platform: macOS
    sources:
      - path: BotDot
      # The figure every bot is drawn from, read from the server's own file (ADR 003): no second copy in Git.
      - path: ../lib/figure.json
        group: Shared
        createIntermediateGroups: false
        buildPhase: resources
    dependencies:
      - package: BotDotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.botdot.mac
        PRODUCT_NAME: botdot
        INFOPLIST_FILE: BotDot/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
