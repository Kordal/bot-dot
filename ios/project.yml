# The iOS app (ADR 242): native SwiftUI on the Android app's shared data layer (android/shared, BotdotShared.xcframework).
# `make ios` builds the framework, makes BotDot.xcodeproj from this file with XcodeGen (the project is not in git) and
# builds and tests it in the simulator. No signing team here: a simulator build is signed ad hoc ("Sign to Run
# Locally", no Apple account), so its entitlements (the Keychain, the App Group) apply; a device build is not signed.
name: BotDot
options:
  bundleIdPrefix: app.botdot
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  BotDot:
    type: application
    platform: iOS
    sources:
      - BotDot
      # The seal and the key the notification extension opens pushes with: the app makes the key and draws nothing.
      - BotDotNotify/Seal.swift
      - BotDotNotify/PushKey.swift
      # The address the share extension sends through, written where it can read it.
      - BotDotShare/SharedAddress.swift
      # The figure definition every app draws its bots from (ADR 003), the server's own file: a copy in the app, until
      # the server hands out its own.
      - path: ../lib/figure.json
        buildPhase: resources
    dependencies:
      # Built by `make ios` (./gradlew :shared:assembleBotdotSharedDebugXCFramework); static, so nothing is embedded.
      # Debug: it links in seconds where Release takes minutes; an archive for TestFlight needs the Release one.
      - framework: ../android/shared/build/XCFrameworks/debug/BotdotShared.xcframework
        embed: false
      - target: BotDotNotify
      - target: BotDotShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botdot
        PRODUCT_NAME: BotDot
        OTHER_LDFLAGS: [-lc++]
    info:
      path: BotDot/Info.plist
      properties:
        CFBundleDisplayName: botdot
        UILaunchScreen: {}
        # The front door's sign-in hands back to botdot://signed-in?code=… (ASWebAuthenticationSession takes it first).
        CFBundleURLTypes:
          - CFBundleURLName: app.botdot.sign-in
            CFBundleURLSchemes: [botdot]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: BotDot/BotDot.entitlements
      properties:
        com.apple.security.application-groups: [group.app.botdot]
        keychain-access-groups: [$(AppIdentifierPrefix)app.botdot]
        # Apple's push service (ADR 150). An archive for TestFlight and the App Store is exported with "production".
        aps-environment: development
  # The notification extension (ADR 150): it opens a push's seal with the key the app keeps in their shared Keychain
  # group and shows botdot's words and buttons. Swift alone, without the shared data layer (BotDotNotify/Seal.swift).
  BotDotNotify:
    type: app-extension
    platform: iOS
    sources: [BotDotNotify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botdot.notify
        PRODUCT_NAME: BotDotNotify
    info:
      path: BotDotNotify/Info.plist
      properties:
        CFBundleDisplayName: botdot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: BotDotNotify/BotDotNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.app.botdot]
        keychain-access-groups: [$(AppIdentifierPrefix)app.botdot]
  # The share extension (#1373): Share → botdot in another app sends files, a link or words to a bot or the Chief,
  # through the botdot the app is signed in to (its address in the App Group, its session in their Keychain group),
  # with the shared data layer's rules (Share), linked here as in the app.
  BotDotShare:
    type: app-extension
    platform: iOS
    sources:
      - BotDotShare
      - BotDot/KeychainSessions.swift
      - BotDot/I18n.swift
      - BotDot/SharedSendable.swift
    dependencies:
      - framework: ../android/shared/build/XCFrameworks/release/BotdotShared.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botdot.share
        PRODUCT_NAME: BotDotShare
        OTHER_LDFLAGS: [-lc++]
    info:
      path: BotDotShare/Info.plist
      properties:
        CFBundleDisplayName: botdot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: BotDotShare/BotDotShare.entitlements
      properties:
        com.apple.security.application-groups: [group.app.botdot]
        keychain-access-groups: [$(AppIdentifierPrefix)app.botdot]
  BotDotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BotDotTests
      # Seals the server made (lib/apns.js), which the extension's opener is tested against.
      - path: ../test/fixtures/push-seals.json
        buildPhase: resources
    dependencies:
      - target: BotDot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botdot.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BotDot.app/BotDot
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  BotDot:
    build:
      targets:
        BotDot: all
        BotDotTests: [test]
    test:
      targets: [BotDotTests]
