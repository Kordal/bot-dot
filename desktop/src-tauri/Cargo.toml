[package]
name = "botdot-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# The app is the library: the desktop's binary starts it, and so does the iOS app (ADR 151).
[lib]
name = "botdot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3.2"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = { version = "3", features = ["platform-verifier"] }

# Only on a desktop: one app at a time, a start at login, the updater and the window's size and place.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", features = ["block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_UI_Shell"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
