# Trivy's rules for the secret scan of every image layer (images.yml, #534; checked by test-layer-secret-scan.sh).
#
# Trivy looks away from whole folders by default: anything under usr/lib, usr/share or usr/include, any path with
# "test", "example", "vendor" or "locale" in it, Markdown, node_modules, lock files and a few file types. botdot's
# own vendor/ folder and the Node packages in usr/local/lib/node_modules are among them, so every one of those
# built-in allow rules (the list of Trivy 0.74, pkg/fanal/secret/builtin-allow-rules.go) and skipped paths is off.
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log
skip-patterns: []
allow-rules:
  # The two public values .gitleaks.toml allows in the source, the README example of a package in the desktop image,
  # and nothing else. .gitleaks.toml's allowed paths are test files, which .dockerignore keeps out of the image.
  - id: botdot-release-verification-key
    description: The release verification public key (SPKI), shipped to every client on purpose; it cannot sign releases
    regex: '^MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEdDU16CG2HWzALPBB5pDx5BQHKTrcfdHF4t90R\+\+nTnsMvIQKGQq/o26wIF0w0o6OEt4RoPi\+Sf2rJsZmz3vvng==$'
  - id: rfc6455-sample-nonce
    description: The sample Sec-WebSocket-Key printed in RFC 6455 ("the sample nonce", base64), a public example
    regex: '^dGhlIHNhbXBsZSBub25jZQ==$'
  - id: pyjwt-readme-example
    description: The example token in PyJWT's README (its METADATA in the desktop image), jwt.encode({"some":"payload"}, "secret")
    regex: '^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzb21lIjoicGF5bG9hZCJ9\.4twFt5NiznN84AWoo1d7KO1T_yoc0Z6XOpOVswacPZg$'
