; the account's computer: cua's services of the base image (its /etc/supervisor/supervisord.conf), run as box,
; the user that the container runs as (lib/computers.js), with that user's home, in place of root's (#311).
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/botdot-desktop/supervisord.pid
childlogdir=/var/log/supervisor

[program:vnc-desktop]
command=/usr/local/bin/botdot-desktop
environment=HOME="/home/box",DISPLAY=":1"
autorestart=true
startsecs=8
priority=10

[program:cua-driver-mcp]
command=/usr/local/bin/supergateway --stdio "/usr/local/bin/cua-driver mcp" --outputTransport streamableHttp --stateful --sessionTimeout 3600000 --port 3000 --streamableHttpPath /mcp --healthEndpoint /healthz --cors
environment=HOME="/home/box",DISPLAY=":1"
autorestart=true
startsecs=2
priority=20

[program:computer-server]
command=/opt/computer-server/venv/bin/python -m computer_server --host 0.0.0.0 --port 8000
environment=HOME="/home/box",DISPLAY=":1",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=2
priority=20

[program:novnc]
command=/opt/computer-server/venv/bin/python -m websockify --web /opt/noVNC 6080 127.0.0.1:5901
environment=HOME="/home/box"
autorestart=true
startsecs=2
priority=20
