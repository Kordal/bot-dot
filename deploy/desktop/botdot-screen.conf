; One bot's screen on the account's computer (#105): cua's services of the base image (its
; /etc/supervisor/supervisord.conf) on the screen's own X display and ports, run as box, the user that the container
; runs as, with that user's home. botdot starts one supervisord with this for each bot that uses its computer, with
; the screen in its environment (lib/computers.js startScreen): SCREEN (the display's number), SCREEN_DISPLAY,
; VNC_PORT, NOVNC_PORT, API_PORT and WORKDIR, the bot's own folder, where its shell commands start.
; cua's driver MCP (port 3000), which botdot never used, is not started.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/screen-%(ENV_SCREEN)s.log
pidfile=/run/botdot-desktop/screen-%(ENV_SCREEN)s.pid
childlogdir=/var/log/supervisor

[program:vnc-desktop]
command=/usr/local/bin/botdot-desktop
environment=HOME="/home/box",DISPLAY="%(ENV_SCREEN_DISPLAY)s"
autorestart=true
startsecs=8
priority=10

[program:computer-server]
command=/opt/computer-server/venv/bin/python -m computer_server --host 0.0.0.0 --port %(ENV_API_PORT)s
directory=%(ENV_WORKDIR)s
environment=HOME="/home/box",DISPLAY="%(ENV_SCREEN_DISPLAY)s",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=2
priority=20

[program:novnc]
command=/opt/computer-server/venv/bin/python -m websockify --web /opt/noVNC %(ENV_NOVNC_PORT)s 127.0.0.1:%(ENV_VNC_PORT)s
environment=HOME="/home/box"
autorestart=true
startsecs=2
priority=20
