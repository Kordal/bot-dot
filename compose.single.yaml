# botdot as one Compose app on any Docker host: plain Docker (with compose.single.caddy.yaml when it has no
# reverse proxy of its own), Dokploy, Coolify, Portainer (docs/install-docker.md). A machine of one account, as the Mac's was (ADR 028): its front door, its botdot
# server and the docker-helper. Nothing publishes a port: the host's proxy (Traefik in Dokploy) routes your domain
# to the front-door service on port 4700 and terminates HTTPS. Data lives in named volumes, which a redeploy keeps.
#
# Unlike install.sh's machine, there is one account, no gVisor and no account's rootless Docker: the helper gets
# this host's Docker socket, so the bots' computers run beside the host's other containers. botdot's own updater
# is off (an account's server never updates itself, server.js UPDATES_BY_ADMIN): redeploy to update. Images are
# not checked against botdot's release key as install.sh checks them; pin BOT_DOT_IMAGE to a digest for that.
#
# Settings, in the app's environment (.env):
#   FRONT_DOOR_ORIGIN      the address you open, https://botdot.example.com (a passkey belongs to its name)
#   FRONT_DOOR_SETUP_KEY   32 to 100 base64url characters that open the one sign-up page, until your passkey exists
#   FRONT_DOOR_ACCOUNT     your account's name (default owner): 2 to 31 lowercase letters, digits and dashes, starting
#                          with a letter. It can't be changed once your passkey is made.
#   TZ                     the time zone schedules use (default UTC)
services:
  bot-dot:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    pull_policy: always                             # a redeploy takes the newest release
    restart: unless-stopped
    # Only the local process/file supervisor remains root. server.js runs as 60000:60000.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: ${TZ:-UTC}                              # schedules use this time zone
      HOST: 0.0.0.0                               # inside the container, which publishes no port
      PORT: 4747
      # Optional instead of /login: a token from `claude setup-token`
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The bots' computer, downloaded the first time a bot needs one.
      BOT_DOT_COMPUTER_IMAGE: ${BOT_DOT_COMPUTER_IMAGE:-ghcr.io/kordal/bot-dot-desktop:latest}
      BOT_DOT_HELPER_SOCKET: /run/botdot/helper.sock
      # The one account, and the socket its front door reaches it on (the supervisor gives the folder to botdot's user)
      BOT_DOT_ACCOUNT: ${FRONT_DOOR_ACCOUNT:-owner}
      BOT_DOT_FRONT_DOOR_SOCKET: /run/front-door/${FRONT_DOOR_ACCOUNT:-owner}/botdot.sock
    volumes:
      - bot-dot-data:/data                          # bots, runs, memory, skills, vault (encrypted)
      - bot-dot-config:/config                      # the vault's encryption key, kept apart from the data
      - bot-dot-home:/root                          # application sign-ins
      - bot-dot-helper:/run/botdot:ro                # connect only; helper owns directory and socket
      - bot-dot-front-door:/run/front-door           # botdot's socket, for the front door
    depends_on:
      - docker-helper

  docker-helper:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    pull_policy: always                             # a redeploy takes the newest release
    command: ["node", "lib/docker-helper.js"]
    restart: unless-stopped
    # Root with the Docker socket is as powerful as root on this machine; only the operations that
    # lib/docker-helper.js allows limit it. It runs without capabilities or new privileges, so a flaw in it
    # gives as little else as possible (SECURITY.md).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # In the server's group (SERVER_GID in lib/docker-helper.js), so it can hand the server its socket
    # without the capability CHOWN.
    group_add: ["60000"]
    healthcheck:
      disable: true
    environment:
      TZ: ${TZ:-UTC}
      BOT_DOT_COMPUTER_IMAGE: ${BOT_DOT_COMPUTER_IMAGE:-ghcr.io/kordal/bot-dot-desktop:latest}
      # Only while the images are private: a token that may read ghcr.io's packages
      BOT_DOT_REGISTRY_TOKEN: ${BOT_DOT_REGISTRY_TOKEN:-}
    volumes:
      - bot-dot-helper:/run/botdot
      - /var/run/docker.sock:/var/run/docker.sock

  # Gives the front door's data volume to the front door's user once, before it starts: a new named volume is root's.
  # A volume it already has is left alone: without CAP_FOWNER root may not chmod a folder that is no longer its own.
  front-door-data:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    pull_policy: always                             # a redeploy takes the newest release
    entrypoint: ["sh", "-c", "if [ \"$$(stat -c %u:%g:%a /front-door)\" != 60000:60000:700 ]; then chmod 700 /front-door && chown 60000:60000 /front-door; fi"]
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    healthcheck:
      disable: true
    volumes:
      - front-door-data:/front-door

  # The front door (ADR 028): the one thing your browser and the Android app reach, through the host's proxy. It
  # signs them in with the passkey and passes their requests to botdot's socket, as botdot's own user.
  front-door:
    image: ${BOT_DOT_IMAGE:-ghcr.io/kordal/bot-dot:latest}
    pull_policy: always                             # a redeploy takes the newest release
    command: ["node", "front-door.js"]
    restart: unless-stopped
    user: "60000:60000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    expose: ["4700"]
    environment:
      TZ: ${TZ:-UTC}
      FRONT_DOOR_ORIGIN: ${FRONT_DOOR_ORIGIN:?the address you open, e.g. https://botdot.example.com}
      FRONT_DOOR_HOST: 0.0.0.0
      FRONT_DOOR_PORT: 4700
      # The host's proxy is what reaches the front door: the client is the address it added last.
      FRONT_DOOR_BEHIND_PROXY: "1"
      FRONT_DOOR_SOCKETS: /run/front-door
      FRONT_DOOR_DATA: /front-door
      FRONT_DOOR_ONE_ACCOUNT: ${FRONT_DOOR_ACCOUNT:-owner}
      # Opens the one account's sign-up page, at <origin>/sign-up/<key>, until the account has its passkey
      FRONT_DOOR_SETUP_KEY: ${FRONT_DOOR_SETUP_KEY:?32 to 100 base64url characters, e.g. openssl rand -base64 48 | tr '+/' '-_' | tr -d '='}
      # botdot's Android app, by its release certificate (docs/release-signing.md), so it signs in with the passkey
      FRONT_DOOR_ANDROID_KEYS: ${FRONT_DOOR_ANDROID_KEYS:-CC:05:CE:8B:44:37:30:33:BF:34:93:34:73:21:FD:0C:C8:4B:E3:6B:0E:E5:F1:5D:23:C6:88:8F:C7:BE:6B:E3}
    volumes:
      - front-door-data:/front-door                 # the account, its passkey and sessions
      - bot-dot-front-door:/run/front-door
    depends_on:
      front-door-data:
        condition: service_completed_successfully
      bot-dot:
        condition: service_started

volumes:
  bot-dot-data:
  bot-dot-config:
  bot-dot-home:
  bot-dot-helper:
  bot-dot-front-door:
  front-door-data:
