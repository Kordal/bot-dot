# For compose.single.yaml on a Docker host without a reverse proxy of its own (docs/install-docker.md): Caddy takes
# ports 80 and 443, gets the domain's certificate from Let's Encrypt and passes everything to the front door.
#
#   docker compose -f compose.single.yaml -f compose.single.caddy.yaml up -d
#
# BOT_DOT_DOMAIN is the host name in FRONT_DOOR_ORIGIN, e.g. botdot.example.com; its DNS must point at this host.
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${BOT_DOT_DOMAIN:?the host name in FRONT_DOOR_ORIGIN}", "--to", "front-door:4700"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data                            # the certificates
      - caddy-config:/config
    depends_on:
      - front-door

volumes:
  caddy-data:
  caddy-config:
